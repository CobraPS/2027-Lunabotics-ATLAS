name: RoboRIO build and test

on:
  pull_request:
    paths:
      - 'roborio/**'
      - '.github/workflows/roborio-build.yml'
  push:
    branches: [main]
    paths:
      - 'roborio/**'
      - '.github/workflows/roborio-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: roborio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Install native desktop build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install WPILib RoboRIO cross-compiler
        run: ./gradlew installRoboRioToolchain --no-daemon
      - name: Build RoboRIO and desktop binaries and run tests
        run: ./gradlew build --no-daemon --max-workers=2
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborio-test-results
          path: 'roborio/build/test-results/**/*.xml'
          if-no-files-found: warn
