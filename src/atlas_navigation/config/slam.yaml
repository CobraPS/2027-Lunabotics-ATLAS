slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    solver_plugin: solver_plugins::CeresSolver
    use_scan_matching: true
    use_scan_barycenter: true
    # Match scans to their original odometry timestamps; never substitute wall time.
    restamp_tf: false
    transform_publish_period: 0.02
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
    scan_queue_size: 1
    throttle_scans: 1
    minimum_time_interval: 0.15
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    map_update_interval: 1.0
    resolution: 0.05
    # The coarse projected cloud may provide only one ray per distant map cell.
    min_pass_through: 1
    min_laser_range: 0.05
    max_laser_range: 12.0
    do_loop_closing: true
    enable_interactive_mode: false
    use_map_saver: true
    stack_size_to_use: 40000000
