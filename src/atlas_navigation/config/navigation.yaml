# Provisional transport footprint includes wheels and all raised drums.
# Update both costmaps if mechanical dimensions change; tests guard the envelope.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.3
    navigators: [navigate_to_pose]
    error_code_names: [compute_path_error_code, follow_path_error_code]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerLattice
      # 5 cm / 16-heading differential-drive primitives are resolved at launch.
      tolerance: 0.2
      allow_unknown: true
      allow_reverse_expansion: false
      max_planning_time: 5.0
      change_penalty: 0.0
      non_straight_penalty: 1.1
      rotation_penalty: 5.0
      cost_penalty: 2.0
      analytic_expansion_max_length: 5.0
      cache_obstacle_heuristic: false
      smooth_path: true

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.25
      lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.4
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 0.8
      transform_tolerance: 0.3
      use_rotate_to_heading: true
      allow_reversing: false
      min_approach_linear_velocity: 0.04
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.08
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    cycle_frequency: 10.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.8
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity: [0.25, 0.0, 0.5]
    min_velocity: [-0.15, 0.0, -0.5]
    max_accel: [0.5, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -0.8]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3
    odom_topic: /odom

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      footprint: "[[0.73, 0.36715], [0.73, -0.36715], [-0.73, -0.36715], [-0.73, 0.36715]]"
      # Low .17 m perimeter ducts can sit in front of the observed wall face.
      footprint_padding: 0.20
      transform_tolerance: 0.3
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.0
          obstacle_min_range: 0.05
          obstacle_max_range: 8.0
          raytrace_min_range: 0.05
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.2
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.73, 0.36715], [0.73, -0.36715], [-0.73, -0.36715], [-0.73, 0.36715]]"
      # Low .17 m perimeter ducts can sit in front of the observed wall face.
      footprint_padding: 0.20
      transform_tolerance: 0.3
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        # Retained observed free cells override SLAM history until reobserved/reset.
        # Unknown obstacle-layer cells preserve the static map.
        combination_method: 0
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.0
          obstacle_min_range: 0.05
          obstacle_max_range: 10.0
          raytrace_min_range: 0.05
          raytrace_max_range: 12.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.2
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
